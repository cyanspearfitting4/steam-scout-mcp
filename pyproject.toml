[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-scout-mcp"
version = "0.1.0"
description = "MCP server for Steam market research: regional prices (US, EU, Japan, Korea, China), reviews, player counts, charts and news. No API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "model-context-protocol", "steam", "gamedev", "pricing", "claude", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
steam-scout-mcp = "steam_scout_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_scout_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
